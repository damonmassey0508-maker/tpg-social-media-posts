  {id:"c1",cat:"carousel",pill:"pill-carousel",type:"Carousel",title:"5 Mistakes Columbus Buyers Make in a Hot Market",
  hook:`SLIDE 1 HOOK: "You're losing homes before you even make an offer. Here's why 👇"`,
  body:`SLIDE 1 (Cover): "5 Mistakes Columbus Buyers Are Making Right Now — And How to Stop Losing Homes"

SLIDE 7 (CTA): Stop losing homes. I help Columbus buyers WIN in competitive markets. DM me "READY" and let's get you moving.`,
  caption:`5 mistakes Columbus buyers are making RIGHT NOW — save this before your next showing 💛\n\n12 years in this market. I know what works.\n\nDM me "READY" if you're serious about buying in Columbus.\n\n#ColumbusRealEstate #ColumbusHomes #FirstTimeHomeBuyer #BuyersAgent #OhioRealEstate #ThePropertyGuy #ColumbusOhio`},

  {id:"c2",cat:"carousel",pill:"pill-carousel",type:"Carousel",title:"What OFHA Can Do For You: Ohio First-Time Buyer Assistance",

  body:`SLIDE 1 (Cover): "Free Money for Your First Home? Ohio's OFHA Program — What You Need to Know"

The Ohio Housing Finance Agency (OFHA) helps first-time buyers get into homes with down payment assistance, reduced interest rates, and grants. Yes — actual grant money you don't pay back.

• Your Choice! Down Payment Assistance — 2.5% or 5% of purchase price
• Ohio Heroes — extra benefits for teachers, nurses, first responders, vets

1. Connect with an OFHA-approved lender

SLIDE 7 (CTA): Ready to see if you qualify? DM me "OFHA" and I'll connect you with the right lender TODAY.`,
  caption:`Ohio is literally handing out money for your first home — most buyers don't even know this exists.\n\nSave this post. Share it with someone who's renting and ready to buy.\n\nDM me "OFHA" — I'll walk you through every step.\n\n#OFHA #OhioHousingFinance #FirstTimeHomeBuyer #ColumbusOhio #DownPaymentAssistance #OhioRealEstate #ThePropertyGuy`},

  {id:"c3",cat:"carousel",pill:"pill-carousel",type:"Carousel",title:"Investor's Guide: Wholesale, Fix & Flip, Airbnb in Columbus",
  hook:`SLIDE 1 HOOK: "Columbus is one of the TOP real estate investment markets in the country. Here's how to play it. 👇"`,
  body:`SLIDE 1 (Cover): "3 Ways Smart Investors Are Making Money in Columbus Real Estate Right Now"

SLIDE 2: Strategy 1 — Wholesale (Flip the Contract, Not the House)
Find distressed properties, get them under contract below market value, and assign the contract to another investor for a fee. No renovations. No holding costs. Pure deal-making. Columbus has a steady stream of distressed inventory if you know where to look.

SLIDE 3: Strategy 2 — Fix & Flip
Columbus is a flipper's market. Target the 43204, 43223, 43211 zip codes for value-add opportunities. ARV (after repair value) matters more than purchase price. Run your numbers tight: purchase + rehab + holding costs + selling costs must leave 20%+ profit.

SLIDE 4: Strategy 3 — Airbnb/Short-Term Rental
Columbus hosts 50+ events per year — Ohio State games, conventions, concerts. Short-term rental demand is MASSIVE. The Short North, German Village, and near-campus properties cash flow heavily when done right.

SLIDE 5: What Every Investor Needs Before They Start
✔ Proof of funds or hard money lined up

✔ A realistic ARV analysis

SLIDE 7 (CTA): I work with investors at every level — from first deal to portfolio builders. DM me "INVEST" and let's talk numbers.`,
  caption:`Columbus real estate investors are quietly building wealth while everyone else is waiting.\n\nWholesale. Fix & Flip. Airbnb. The playbook is right here.\n\nDM me "INVEST" — 12 years of Columbus market knowledge at your service.\n\n#ColumbusInvestor #RealEstateInvesting #FixAndFlip #AirbnbInvesting #ColumbusOhio #WholesaleRealEstate #ThePropertyGuy`},

  caption:`If this is you — you NEED a strategy, not just a search app.\n\nDM me or comment READY below.\n\n#ColumbusRealEstate #BuyersAgent #ColumbusOhio #HomeBuying #ThePropertyGuy #OhioRealEstate`},

  caption:`Ohio literally has money waiting for first-time buyers. Most people never claim it.\n\nDrop OFHA in the comments — I'll DM you the details.\n\n#FirstTimeHomeBuyer #OFHA #ColumbusOhio #OhioRealEstate #DownPaymentAssistance #ThePropertyGuy`},

  {id:"av3",cat:"avatar",pill:"pill-avatar",type:"Avatar Reel",title:"Why Columbus Investors Love This Market",
  hook:`HOOK TEXT: "Columbus is producing more millionaires through real estate than almost any Midwest city."`,

  caption:`Columbus investors already know. Now you do too.\n\nComment NUMBERS below — I'll pull the data on any Columbus zip code.\n\n#ColumbusInvestor #RealEstateInvesting #ColumbusOhio #CashFlow #Airbnb #FixAndFlip #ThePropertyGuy`},

  {id:"oc1",cat:"onscreen",pill:"pill-reel",type:"On-Camera Reel",title:"\"I Have 12 Years of Stories\" — Social Proof Reel",
  hook:`HOOK: "In 12 years, I've seen buyers lose their dream home because of ONE mistake."`,
  body:`[YOU on camera — stand in front of a Columbus home, car, or office. Casual but confident.]

  caption:`12 years. Hundreds of Columbus families. One rule: be ready to move.\n\nDrop CALL ME below or DM me directly.\n\n#ColumbusRealEstate #BuyersAgent #ThePropertyGuy #ColumbusOhio #HomeBuying #OhioRealEstate`},

  {id:"oc2",cat:"onscreen",pill:"pill-reel",type:"On-Camera Reel",title:"Seller Testimonial-Style Reel — $28K Over Asking",

  caption:`$28K over asking. This is what a real strategy looks like.\n\nThinking about selling? DM me SELL below.\n\n#ColumbusRealEstate #HomeSelling #ThePropertyGuy #JustSold #ColumbusOhio #ListingAgent #SoldOverAsking`},

  {id:"bn1",cat:"buyer_negotiate",pill:"pill-reel",type:"On-Camera Reel",title:"How to Negotiate in a Sellers Market",
  hook:`HOOK: "Stop negotiating like it's 2015. Here's how to win in today's Columbus market."`,
  body:`[YOU on camera or avatar, confident and clear]

"If you're still trying to negotiate like there's a buyer's market — you are going to lose every single time.

  {id:"bn2",cat:"buyer_negotiate",pill:"pill-carousel",type:"Carousel",title:"The Winning Offer Checklist",
  hook:`SLIDE 1: "Want to write an offer that actually wins in Columbus? Use this checklist."`,
  body:`SLIDE 1 (Cover): "The Columbus Winning Offer Checklist — Save This Before You Make Your Next Offer"

SLIDE 2: ✅ Full Pre-Approval Letter Attached

  hook:`HOOK: "Most first-time buyers start in the wrong place. Here's where to actually start."`,
  body:`[On-camera or avatar — warm, helpful tone]

"If you're a first-time homebuyer and your first step was opening Zillow — you started in the wrong place.

Here's where you actually start:

Step one: know your credit score. Go to annualcreditreport.com — free, no gimmicks. You need at minimum a 580 for FHA loans, 640+ for most programs including OFHA.

Step two: document your income. Two years of W-2s, recent pay stubs, bank statements going back 60 days. Lenders are going to ask for all of this.

Step three: get pre-approved — not pre-qualified. Call a local Columbus lender and get the actual pre-approval letter. This tells you your real budget.

  caption:`Don't start on Zillow. Start HERE.\n\nComment FIRST below and I'll send you my free Columbus first-time buyer guide.\n\n#FirstTimeHomeBuyer #ColumbusOhio #HomeBuyingTips #OFHA #OhioRealEstate #ThePropertyGuy`},

  {id:"ftb2",cat:"ftb",pill:"pill-carousel",type:"Carousel",title:"OFHA Step-by-Step: Securing Ohio Down Payment Assistance",
  hook:`SLIDE 1: "Ohio first-time buyers: here are the exact steps to get down payment assistance."`,
  body:`SLIDE 1 (Cover): "How to Secure OFHA Down Payment Assistance in Ohio — Step by Step"

SLIDE 2: Step 1 — Check Your Eligibility
• First-time buyer (or no homeownership in last 3 years)
• Meet income limits for Franklin County
• Plan to use home as primary residence
• Minimum credit score: 640 (for most OFHA programs)

SLIDE 3: Step 2 — Complete Homebuyer Education
OFHA requires a HUD-approved homebuyer education course.
• Available online at eHome America or Framework
• Takes about 6–8 hours
• Costs around $75 — often reimbursable

SLIDE 4: Step 3 — Connect With an OFHA-Approved Lender
Not all lenders offer OFHA programs. You MUST use an approved lender. Ask for the "Your Choice! Down Payment Assistance" product. Get your pre-approval letter.

SLIDE 5: Step 4 — Choose Your DPA Option
• 2.5% DPA: Forgivable after 7 years
• 5% DPA: Same forgiveness rules — larger help, same commitment
• On a $250K home: that's $6,250–$12,500 in assistance

SLIDE 6: Step 5 — Find Your Home

// Build sidebar
const sidebar=document.getElementById('sidebar');
const groups={};
categories.forEach(c=>{if(!groups[c.group])groups[c.group]=[];groups[c.group].push(c);});
Object.entries(groups).forEach(([gname,cats])=>{
  const sec=document.createElement('div');sec.className='sidebar-section';
  const lbl=document.createElement('div');lbl.className='sidebar-label';lbl.textContent=gname;sec.appendChild(lbl);
  cats.forEach(c=>{
    const count=scripts.filter(s=>s.cat===c.id).length;
    const btn=document.createElement('button');
    btn.className='sidebar-btn'+(c.id==='carousel'?' active':'');
    btn.id='nav-'+c.id;
    btn.innerHTML=c.label+'<span class="sidebar-count">'+count+'</span>';
    btn.onclick=()=>showCat(c.id);
    sec.appendChild(btn);
  });
  sidebar.appendChild(sec);
});

let activeCat='carousel';

function showCat(id){
  activeCat=id;
  document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+id).classList.add('active');
  renderMain();
}

function renderMain(){
  const cat=categories.find(c=>c.id===activeCat);
  const filtered=scripts.filter(s=>s.cat===activeCat);
  const main=document.getElementById('main');
  main.innerHTML=`<div class="cat-header"><div class="cat-title">${cat.label}</div><div class="cat-desc">${descs[cat.id]||''}</div></div><div id="cards"></div>`;
  const cardsEl=document.getElementById('cards');
  filtered.forEach(s=>{
    const card=document.createElement('div');card.className='script-card';card.id='card-'+s.id;
    const hasCaption=s.caption&&s.caption.trim().length>0;
    card.innerHTML=`<div class="card-trigger" onclick="toggleCard('${s.id}')"><span class="type-pill ${s.pill}">${s.type}</span><span class="card-title-text">${s.title}</span><span class="chevron" id="chev-${s.id}">&#9660;</span></div>
    <div class="card-body" id="body-${s.id}">
      <div class="block"><div class="block-label">Hook / Opening</div><div class="hook-box">${s.hook}</div></div>
      <div class="block"><div class="block-label">Full Script</div><div class="script-box">${s.body}</div><div class="copy-row"><button class="copy-btn" onclick="cp('${s.id}','script')">Copy script</button></div></div>
      ${hasCaption?`<div class="block"><div class="block-label">Caption + Hashtags</div><div class="caption-box">${s.caption}</div><div class="copy-row"><button class="copy-btn" onclick="cp('${s.id}','caption')">Copy caption</button></div></div>`:''}
    </div>`;
    cardsEl.appendChild(card);
  });
}

function toggleCard(id){
  const body=document.getElementById('body-'+id);const chev=document.getElementById('chev-'+id);
  const open=body.classList.contains('open');
  document.querySelectorAll('.card-body.open').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('.chevron.open').forEach(el=>el.classList.remove('open'));
  if(!open){body.classList.add('open');chev.classList.add('open');}
}

function cp(id,type){
  const s=scripts.find(x=>x.id===id);
  const text=type==='caption'?s.caption:s.body;
  navigator.clipboard.writeText(text||'').then(()=>{
    const btns=document.querySelectorAll('#card-'+id+' .copy-btn');
    const btn=type==='caption'?btns[btns.length-1]:btns[0];
    if(btn){btn.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent=type==='caption'?'Copy caption':'Copy script';btn.classList.remove('copied');},2000);}
  });
}

renderMain();
</script>
</body>
</html>
